name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Stamps the service worker cache version from a hash of the precached
      # files, then runs the suite. If this is skipped, an update never reaches
      # anyone's phone because the cache name would not change.
      - name: Stamp cache version and test
        run: npm test

      - name: Fail if the stamp changed anything
        run: |
          if ! git diff --quiet sw.js; then
            echo "sw.js cache version was stale. Run 'npm run stamp' and commit before pushing."
            git diff sw.js
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
