<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-label="Reverse Tyler Twist, four step sequence">
  <style>
    .bg{fill:#FAF7F2}
    .limb{fill:#EFE9DF;stroke:#1F2421;stroke-width:2.5;stroke-linejoin:round}
    .imp{fill:#DED3BF;stroke:#1F2421;stroke-width:2.5;stroke-linejoin:round}
    .det{stroke:#1F2421;fill:none;stroke-width:2;stroke-linecap:round;opacity:.35}
    .acc{stroke:#C2543D;fill:none;stroke-width:3.2;stroke-linecap:round}
    .lead{stroke:#C2543D;fill:none;stroke-width:1.4;opacity:.7}
    .ghost{fill:none;stroke:#C2543D;stroke-width:2;stroke-dasharray:6 5;opacity:.8}
    .t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1F2421}
    .h{font-size:22px;font-weight:700}
    .sub{font-size:13.5px;fill:#6B6257}
    .cap{font-size:13.5px}
    .lab{font-size:11.5px;fill:#6B6257}
    .accT{font-size:12.5px;font-weight:700;fill:#C2543D}
    .dose{font-size:13px;fill:#4A443C}
    .div{stroke:#E2D9CB;stroke-width:1.5}
  </style>
  <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#C2543D"/>
  </marker>

  <rect class="bg" x="0" y="0" width="1000" height="440"/>
  <text class="t h" x="22" y="32">Reverse Tyler Twist</text>
  <text class="t sub" x="22" y="54">Eccentric load on the wrist flexors and pronators. Right arm is the injured one.</text>

  <line class="div" x1="256" y1="72" x2="256" y2="392"/>
  <line class="div" x1="508" y1="72" x2="508" y2="392"/>
  <line class="div" x1="760" y1="72" x2="760" y2="392"/>

  <!-- PANEL 1 -->
  <g>
    <rect class="imp" x="124" y="86" width="22" height="170" rx="11"/>
    <line class="det" x1="126" y1="126" x2="144" y2="126"/>
    <line class="det" x1="126" y1="166" x2="144" y2="166"/>
    <line class="det" x1="126" y1="206" x2="144" y2="206"/>
    <rect class="limb" x="26" y="236" width="92" height="28" rx="14" transform="rotate(-8 72 250)"/>
    <circle class="limb" cx="112" cy="246" r="8"/>
    <rect class="limb" x="112" y="212" width="48" height="44" rx="15"/>
    <line class="det" x1="120" y1="226" x2="142" y2="226"/>
    <line class="det" x1="120" y1="240" x2="142" y2="240"/>
    <path class="lead" d="M80,292 L102,268 L114,250"/>
    <text class="t accT" x="30" y="306">wrist flexed</text>
    <text class="t lab" x="30" y="222">forearm</text>
    <text class="t cap" x="22" y="364">1. Bar vertical, right hand</text>
    <text class="t cap" x="22" y="382">low with the wrist flexed.</text>
  </g>

  <!-- PANEL 2 -->
  <g>
    <rect class="imp" x="374" y="104" width="22" height="170" rx="11"/>
    <line class="det" x1="376" y1="158" x2="394" y2="142"/>
    <line class="det" x1="376" y1="198" x2="394" y2="182"/>
    <line class="det" x1="376" y1="238" x2="394" y2="222"/>
    <rect class="limb" x="276" y="254" width="92" height="28" rx="14" transform="rotate(-8 322 268)"/>
    <circle class="limb" cx="362" cy="264" r="8"/>
    <rect class="limb" x="362" y="230" width="48" height="44" rx="15"/>
    <line class="det" x1="370" y1="244" x2="392" y2="244"/>
    <rect class="limb" x="408" y="110" width="86" height="28" rx="14" transform="rotate(10 451 124)"/>
    <rect class="limb" x="362" y="102" width="48" height="44" rx="15"/>
    <line class="det" x1="370" y1="116" x2="392" y2="116"/>
    <path class="acc" d="M352,94 A34,24 0 0 1 418,94" marker-end="url(#ar)"/>
    <text class="t accT" x="344" y="90" text-anchor="end">twist</text>
    <text class="t lab" x="462" y="162" text-anchor="middle">left hand</text>
    <text class="t lab" x="330" y="300" text-anchor="middle">right hand stays low</text>
    <text class="t cap" x="274" y="364">2. Left hand grabs the top</text>
    <text class="t cap" x="274" y="382">and twists the bar.</text>
  </g>

  <!-- PANEL 3 -->
  <g>
    <rect class="imp" x="560" y="176" width="152" height="22" rx="11"/>
    <line class="det" x1="618" y1="178" x2="606" y2="196"/>
    <line class="det" x1="648" y1="178" x2="636" y2="196"/>
    <line class="det" x1="678" y1="178" x2="666" y2="196"/>
    <rect class="limb" x="512" y="218" width="64" height="28" rx="14" transform="rotate(-25 544 232)"/>
    <rect class="limb" x="694" y="218" width="64" height="28" rx="14" transform="rotate(25 726 232)"/>
    <rect class="limb" x="552" y="158" width="44" height="58" rx="15"/>
    <rect class="limb" x="672" y="158" width="44" height="58" rx="15"/>
    <text class="t lab" x="574" y="146" text-anchor="middle">right</text>
    <text class="t lab" x="694" y="146" text-anchor="middle">left</text>
    <text class="t accT" x="636" y="298" text-anchor="middle">bar stays twisted</text>
    <text class="t cap" x="526" y="364">3. Extend both arms out in</text>
    <text class="t cap" x="526" y="382">front, bar horizontal.</text>
  </g>

  <!-- PANEL 4 -->
  <g>
    <rect class="imp" x="826" y="176" width="140" height="24" rx="12"/>
    <line class="det" x1="898" y1="178" x2="898" y2="198"/>
    <line class="det" x1="930" y1="178" x2="930" y2="198"/>
    <rect class="limb" x="776" y="238" width="78" height="28" rx="14" transform="rotate(-35 815 252)"/>
    <rect class="ghost" x="832" y="158" width="50" height="60" rx="16" transform="rotate(-34 857 218)"/>
    <rect class="limb" x="832" y="158" width="50" height="60" rx="16"/>
    <line class="det" x1="840" y1="176" x2="874" y2="176"/>
    <line class="det" x1="840" y1="192" x2="874" y2="192"/>
    <path class="acc" d="M828,144 A48,30 0 0 1 898,148" marker-end="url(#ar)"/>
    <text class="t accT" x="908" y="140">4 seconds</text>
    <line class="ghost" x1="778" y1="296" x2="806" y2="296"/>
    <text class="t lab" x="814" y="300">dashed = start, flexed</text>
    <text class="t cap" x="778" y="364">4. Let the right wrist untwist</text>
    <text class="t cap" x="778" y="382">slowly. Only this is the work.</text>
  </g>

  <text class="t dose" x="22" y="420">3 sets of 15, 60 seconds rest between sets. Every day. Red FlexBar to start, green once red gets easy.</text>
</svg>
