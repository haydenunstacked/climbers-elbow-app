<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="Flare day isometric holds, two options">
  <style>
    .bg{fill:#FAF7F2}
    .lm{fill:#F2EDE4;stroke:#1F2421;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
    .im{fill:#DED3BF;stroke:#1F2421;stroke-width:2.2;stroke-linejoin:round}
    .oth{fill:#E2E7E3;stroke:#1F2421;stroke-width:2.2;stroke-linejoin:round}
    .torso{fill:#D6CDBB;stroke:#1F2421;stroke-width:2.2;stroke-linejoin:round}
    .ct{fill:none;stroke:#1F2421;stroke-width:1.3;opacity:.4;stroke-linecap:round}
    .det{stroke:#1F2421;fill:none;stroke-width:1.8;stroke-linecap:round;opacity:.3}
    .acc{stroke:#C2543D;fill:none;stroke-width:3.2;stroke-linecap:round}
    .lead{stroke:#C2543D;fill:none;stroke-width:1.4;opacity:.72}
    .band{stroke:#5E7266;fill:none;stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round}
    .t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1F2421}
    .h{font-size:22px;font-weight:700}
    .sub{font-size:13.5px;fill:#6B6257}
    .cap{font-size:13.5px}
    .lab{font-size:11.5px;fill:#6B6257}
    .accT{font-size:12.5px;font-weight:700;fill:#C2543D}
    .dose{font-size:13px;fill:#4A443C}
    .div{stroke:#E2D9CB;stroke-width:1.5}
  </style>
  <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#C2543D"/>
  </marker>

  <rect class="bg" x="0" y="0" width="720" height="400"/>
  <text class="t h" x="22" y="32">Flare day isometrics</text>
  <text class="t sub" x="22" y="54">Swap these in when the elbow is angry. Do not skip the session, change it.</text>
  <line class="div" x1="362" y1="72" x2="362" y2="356"/>

  <!-- PANEL 1 -->
  <g>
    <rect class="im" x="66" y="94" width="184" height="22" rx="11"/>
    <text class="t lab" x="158" y="86" text-anchor="middle">jug or rail, neutral grip</text>
    <path class="lm" d="M138,96 Q160,92 178,98 Q188,106 188,120 Q188,134 180,140 Q160,146 142,141 Q132,134 131,120 Q132,104 138,96 Z"/>
    <path class="lm" d="M140,100 Q136,118 140,134 Q145,141 151,134 Q155,118 151,100 Q145,94 140,100 Z"/>
    <path class="lm" d="M153,98 Q149,118 153,136 Q158,143 164,136 Q168,118 164,98 Q158,91 153,98 Z"/>
    <path class="lm" d="M166,98 Q162,118 166,136 Q171,143 177,136 Q181,118 177,98 Q171,91 166,98 Z"/>
    <path class="lm" d="M146,138 Q156,132 172,136 Q184,142 182,156 Q180,186 174,206 Q168,218 154,218 Q142,216 140,204 Q136,176 140,150 Q141,141 146,138 Z"/>
    <path class="lm" d="M142,206 Q158,200 172,208 Q182,218 178,232 Q166,258 152,278 Q142,290 130,286 Q120,280 122,268 Q130,240 138,216 Q139,208 142,206 Z"/>
    <circle class="lm" cx="160" cy="210" r="16"/>
    <path class="acc" d="M226,180 A46,46 0 0 0 226,244"/>
    <text class="t accT" x="238" y="216">hold, do not move</text>
    <path class="lead" d="M108,214 L142,210"/>
    <text class="t lab" x="104" y="212" text-anchor="end">elbow bent</text>
    <text class="t lab" x="104" y="228" text-anchor="end">to mid range</text>
    <text class="t accT" x="22" y="300">15 to 20 seconds, 2 to 3 sets</text>
    <text class="t cap" x="22" y="326">1. Neutral grip lock off hold. Hang</text>
    <text class="t cap" x="22" y="344">still at a mid range elbow bend.</text>
  </g>

  <!-- PANEL 2 -->
  <g transform="translate(378,16)">
    <path class="im" d="M26,226 Q94,217 148,223 Q172,226 180,242 Q182,258 166,266 Q98,274 32,269 Q17,264 16,248 Q16,232 26,226 Z"/>
    <text class="t lab" x="98" y="252" text-anchor="middle">thigh</text>
    <path class="lm" d="M48,180 Q100,173 142,181 Q162,185 172,193 L172,211 Q157,217 138,216 Q96,218 50,211 Q37,206 36,196 Q36,185 48,180 Z"/>
    <text class="t lab" x="44" y="172">palm up</text>
    <path class="lm" d="M168,192 Q164,176 176,168 Q188,160 197,170 Q207,160 215,171 Q224,164 229,177 Q233,191 227,204 Q217,221 196,223 Q176,222 169,208 Q164,199 168,192 Z"/>
    <path class="ct" d="M186,174 Q188,184 185,194"/><path class="ct" d="M204,174 Q206,184 203,194"/>
    <path class="oth" d="M166,150 Q162,136 174,129 Q186,122 195,131 Q205,122 213,132 Q222,126 227,138 Q231,151 225,162 Q214,176 194,177 Q175,176 168,164 Q163,157 166,150 Z"/>
    <path class="ct" d="M184,134 Q186,144 183,153"/><path class="ct" d="M202,134 Q204,144 201,153"/>
    <text class="t lab" x="168" y="130" text-anchor="end">left hand presses down</text>
    <path class="acc" d="M252,140 L252,166" marker-end="url(#ar)"/>
    <path class="acc" d="M252,214 L252,188" marker-end="url(#ar)"/>
    <text class="t lab" x="328" y="248" text-anchor="end">right hand presses up</text>
    <text class="t accT" x="4" y="284">45 seconds at about 70 percent, 5 reps</text>
    <text class="t cap" x="4" y="310">2. Or press the right hand up into</text>
    <text class="t cap" x="4" y="328">the left. Neither hand wins.</text>
  </g>
  <text class="t dose" x="22" y="382">Pick either one. Pain relief plus it keeps the tendon loaded on the days eccentrics are too much.</text>
</svg>
