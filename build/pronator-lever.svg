<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="Pronator lever with a hammer, two steps">
  <style>
    .bg{fill:#FAF7F2}
    .lm{fill:#F2EDE4;stroke:#1F2421;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
    .im{fill:#DED3BF;stroke:#1F2421;stroke-width:2.2;stroke-linejoin:round}
    .hd{fill:#B9AE99;stroke:#1F2421;stroke-width:2.2;stroke-linejoin:round}
    .oth{fill:#E2E7E3;stroke:#1F2421;stroke-width:2.2;stroke-linejoin:round}
    .torso{fill:#D6CDBB;stroke:#1F2421;stroke-width:2.2;stroke-linejoin:round}
    .ct{fill:none;stroke:#1F2421;stroke-width:1.3;opacity:.4;stroke-linecap:round}
    .det{stroke:#1F2421;fill:none;stroke-width:1.8;stroke-linecap:round;opacity:.3}
    .acc{stroke:#C2543D;fill:none;stroke-width:3.2;stroke-linecap:round}
    .lead{stroke:#C2543D;fill:none;stroke-width:1.4;opacity:.72}
    .band{stroke:#5E7266;fill:none;stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round}
    .t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1F2421}
    .h{font-size:22px;font-weight:700}
    .sub{font-size:13.5px;fill:#6B6257}
    .cap{font-size:13.5px}
    .lab{font-size:11.5px;fill:#6B6257}
    .accT{font-size:12.5px;font-weight:700;fill:#C2543D}
    .dose{font-size:13px;fill:#4A443C}
    .div{stroke:#E2D9CB;stroke-width:1.5}
  </style>
  <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#C2543D"/>
  </marker>

  <rect class="bg" x="0" y="0" width="720" height="400"/>
  <text class="t h" x="22" y="32">Pronator lever</text>
  <text class="t sub" x="22" y="54">Hammer held near the end of the handle. Seated, right forearm on the thigh, palm up.</text>
  <line class="div" x1="362" y1="72" x2="362" y2="356"/>

  <!-- PANEL 1 -->
  <g>
    <path class="im" d="M26,226 Q94,217 148,223 Q172,226 180,242 Q182,258 166,266 Q98,274 32,269 Q17,264 16,248 Q16,232 26,226 Z"/>
    <text class="t lab" x="98" y="252" text-anchor="middle">thigh</text>
    <path class="lm" d="M48,180 Q100,173 142,181 Q162,185 172,193 L172,211 Q157,217 138,216 Q96,218 50,211 Q37,206 36,196 Q36,185 48,180 Z"/>
    <text class="t lab" x="52" y="172">palm up</text>
    <path class="lm" d="M172,180 Q192,174 206,184 Q216,196 212,210 Q204,222 190,222 Q176,219 170,208 Q167,192 172,180 Z"/>
    <path class="lm" d="M174,184 Q190,178 202,184 Q208,192 200,198 Q186,202 174,196 Z"/>
    <g>
    <animateTransform attributeName="transform" type="rotate" values="0 195 202;0 195 202;-130 195 202;-130 195 202" keyTimes="0;.12;.55;1" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.88;1" dur="3s" repeatCount="indefinite"/>
    <g transform="rotate(40 208 202)">
      <rect class="im" x="208" y="195" width="80" height="14" rx="7"/>
      <rect class="hd" x="280" y="182" width="26" height="40" rx="5"/>
    </g>
    </g>
    <path class="acc" d="M282,254 A78,78 0 0 0 250,152" marker-end="url(#ar)"/>
    <text class="t accT" x="40" y="132">rotate up</text>
    <text class="t lab" x="196" y="304">head hangs to the thumb side</text>
    <text class="t cap" x="22" y="326">1. Start palm up with the hammer</text>
    <text class="t cap" x="22" y="344">head hanging out to the side.</text>
  </g>

  <!-- PANEL 2 -->
  <g transform="translate(351,0)">
    <path class="im" d="M26,226 Q94,217 148,223 Q172,226 180,242 Q182,258 166,266 Q98,274 32,269 Q17,264 16,248 Q16,232 26,226 Z"/>
    <text class="t lab" x="98" y="252" text-anchor="middle">thigh</text>
    <path class="lm" d="M48,180 Q100,173 142,181 Q162,185 172,193 L172,211 Q157,217 138,216 Q96,218 50,211 Q37,206 36,196 Q36,185 48,180 Z"/>
    <path class="lm" d="M172,180 Q192,174 206,184 Q216,196 212,210 Q204,222 190,222 Q176,219 170,208 Q167,192 172,180 Z"/>
    <path class="lm" d="M174,184 Q190,178 202,184 Q208,192 200,198 Q186,202 174,196 Z"/>
    <g>
    <animateTransform attributeName="transform" type="rotate" values="0 191 195;0 191 195;130 191 195;130 191 195" keyTimes="0;.064;.864;1" dur="6.25s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.05;.93;1" dur="6.25s" repeatCount="indefinite"/>
    <rect class="im" x="184" y="106" width="14" height="82" rx="7"/>
    <rect class="hd" x="172" y="80" width="40" height="26" rx="5"/>
    </g>
    <text class="t lab" x="120" y="304" text-anchor="middle">vertical at the top</text>
    <path class="acc" d="M236,118 A74,74 0 0 1 258,210" marker-end="url(#ar)"/>
    <text class="t accT" x="40" y="132">5 second lower</text>
    <text class="t cap" x="31" y="326">2. Rotate to vertical through</text>
    <text class="t cap" x="31" y="344">pronation, then lower slowly.</text>
  </g>
  <text class="t dose" x="22" y="382">2 sets of 15 to 20, three days a week. Early on, use the free hand to help it back up so only the lowering is loaded.</text>
</svg>
