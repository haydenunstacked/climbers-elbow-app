<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="Reverse wrist curl, two positions">
  <style>
    .bg{fill:#FAF7F2}
    .lm{fill:#F2EDE4;stroke:#1F2421;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
    .im{fill:#DED3BF;stroke:#1F2421;stroke-width:2.2;stroke-linejoin:round}
    .hd{fill:#B9AE99;stroke:#1F2421;stroke-width:2.2;stroke-linejoin:round}
    .oth{fill:#E2E7E3;stroke:#1F2421;stroke-width:2.2;stroke-linejoin:round}
    .torso{fill:#D6CDBB;stroke:#1F2421;stroke-width:2.2;stroke-linejoin:round}
    .ct{fill:none;stroke:#1F2421;stroke-width:1.3;opacity:.4;stroke-linecap:round}
    .det{stroke:#1F2421;fill:none;stroke-width:1.8;stroke-linecap:round;opacity:.3}
    .acc{stroke:#C2543D;fill:none;stroke-width:3.2;stroke-linecap:round}
    .lead{stroke:#C2543D;fill:none;stroke-width:1.4;opacity:.72}
    .band{stroke:#5E7266;fill:none;stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round}
    .t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1F2421}
    .h{font-size:22px;font-weight:700}
    .sub{font-size:13.5px;fill:#6B6257}
    .cap{font-size:13.5px}
    .lab{font-size:11.5px;fill:#6B6257}
    .accT{font-size:12.5px;font-weight:700;fill:#C2543D}
    .dose{font-size:13px;fill:#4A443C}
    .div{stroke:#E2D9CB;stroke-width:1.5}
  </style>
  <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#C2543D"/>
  </marker>

  <rect class="bg" x="0" y="0" width="720" height="400"/>
  <text class="t h" x="22" y="32">Reverse wrist curl</text>
  <text class="t sub" x="22" y="54">Same seated setup as the eccentric, but palm down. Light weight, slow both directions.</text>
  <line class="div" x1="362" y1="72" x2="362" y2="356"/>

  <!-- PANEL 1 -->
  <g>
    <path class="im" d="M26,226 Q94,217 148,223 Q172,226 180,242 Q182,258 166,266 Q98,274 32,269 Q17,264 16,248 Q16,232 26,226 Z"/>
    <text class="t lab" x="98" y="252" text-anchor="middle">thigh</text>
    <path class="lm" d="M48,180 Q100,173 142,181 Q162,185 172,193 L172,211 Q157,217 138,216 Q96,218 50,211 Q37,206 36,196 Q36,185 48,180 Z"/>
    <text class="t accT" x="52" y="172">palm down</text>
    <path class="lm" d="M168,206 Q164,222 176,230 Q188,238 197,228 Q207,238 215,227 Q224,234 229,221 Q233,207 227,194 Q217,177 196,175 Q176,176 169,190 Q164,199 168,206 Z"/>
    <path class="ct" d="M186,224 Q188,214 185,204"/><path class="ct" d="M204,224 Q206,214 203,204"/>
    <circle class="im" cx="236" cy="266" r="21"/>
    <circle class="det" cx="236" cy="266" r="8"/>
    <path class="im" d="M208,234 L224,244 L217,256 L201,246 Z"/>
    <text class="t lab" x="120" y="304" text-anchor="middle">bottom, wrist dropped</text>
    <path class="acc" d="M304,246 L304,182" marker-end="url(#ar)"/>
    <text class="t accT" x="304" y="170" text-anchor="middle">curl up</text>
    <text class="t cap" x="22" y="326">1. Start with the wrist dropped,</text>
    <text class="t cap" x="22" y="344">knuckles pointing at the floor.</text>
  </g>

  <!-- PANEL 2 -->
  <g transform="translate(351,0)">
    <path class="im" d="M26,226 Q94,217 148,223 Q172,226 180,242 Q182,258 166,266 Q98,274 32,269 Q17,264 16,248 Q16,232 26,226 Z"/>
    <text class="t lab" x="98" y="252" text-anchor="middle">thigh</text>
    <path class="lm" d="M48,180 Q100,173 142,181 Q162,185 172,193 L172,211 Q157,217 138,216 Q96,218 50,211 Q37,206 36,196 Q36,185 48,180 Z"/>
    <path class="lm" d="M168,186 Q164,170 176,162 Q188,154 197,164 Q207,154 215,165 Q224,158 229,171 Q233,185 227,198 Q217,215 196,217 Q176,216 169,202 Q164,193 168,186 Z"/>
    <path class="ct" d="M186,168 Q188,178 185,188"/><path class="ct" d="M204,168 Q206,178 203,188"/>
    <circle class="im" cx="242" cy="132" r="21"/>
    <circle class="det" cx="242" cy="132" r="8"/>
    <path class="im" d="M208,158 L224,148 L231,160 L215,170 Z"/>
    <text class="t lab" x="120" y="304" text-anchor="middle">top, knuckles lifted</text>
    <path class="acc" d="M306,166 L306,238" marker-end="url(#ar)"/>
    <text class="t accT" x="306" y="262" text-anchor="middle">lower slowly</text>
  </g>
  <text class="t cap" x="382" y="326">2. Curl the knuckles up, then lower</text>
  <text class="t cap" x="382" y="344">back down under control.</text>

  <text class="t dose" x="22" y="382">2 sets of 15, light weight, slow in both directions. Three days a week.</text>
</svg>
