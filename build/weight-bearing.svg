<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="Wall weight-bearing and incline push-up on fists">
  <style>
    .bg{fill:#FAF7F2}
    .lm{fill:#F2EDE4;stroke:#1F2421;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
    .im{fill:#DED3BF;stroke:#1F2421;stroke-width:2.2;stroke-linejoin:round}
    .oth{fill:#E2E7E3;stroke:#1F2421;stroke-width:2.2;stroke-linejoin:round}
    .torso{fill:#D6CDBB;stroke:#1F2421;stroke-width:2.2;stroke-linejoin:round}
    .ct{fill:none;stroke:#1F2421;stroke-width:1.3;opacity:.4;stroke-linecap:round}
    .acc{stroke:#C2543D;fill:none;stroke-width:3.2;stroke-linecap:round}
    .lead{stroke:#C2543D;fill:none;stroke-width:1.4;opacity:.72}
    .ghost{fill:none;stroke:#C2543D;stroke-width:2;stroke-dasharray:6 5;opacity:.8}
    .wall{fill:#E8E1D4;stroke:#1F2421;stroke-width:2.2}
    .t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1F2421}
    .h{font-size:22px;font-weight:700}
    .sub{font-size:13.5px;fill:#6B6257}
    .cap{font-size:13.5px}
    .lab{font-size:11.5px;fill:#6B6257}
    .accT{font-size:12.5px;font-weight:700;fill:#C2543D}
    .dose{font-size:13px;fill:#4A443C}
    .div{stroke:#E2D9CB;stroke-width:1.5}
  </style>
  <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#C2543D"/>
  </marker>

  <rect class="bg" x="0" y="0" width="720" height="400"/>
  <text class="t h" x="22" y="32">Weight through the hand</text>
  <text class="t sub" x="22" y="54">Late wrist phases only, and never for dorsal impingement. Stop at 2 out of 10.</text>
  <line class="div" x1="362" y1="72" x2="362" y2="356"/>

  <!-- PANEL 1 -->
  <g>
    <rect class="wall" x="286" y="80" width="22" height="226"/>
    <text class="t lab" x="297" y="320" text-anchor="middle">wall</text>
    <circle class="lm" cx="126" cy="106" r="22"/>
    <path class="torso" d="M108,134 Q132,128 150,138 Q160,146 160,166 Q160,212 152,248 Q146,266 128,268 Q110,268 102,256 Q94,240 94,212 Q94,166 98,148 Q100,136 108,134 Z" transform="rotate(10 128 200)"/>
    <path class="lm" d="M104,256 Q118,254 120,264 L112,300 Q104,304 98,298 Z"/><path class="lm" d="M132,258 Q146,256 150,266 L156,300 Q150,306 142,300 Z"/>
    <path class="lm" d="M146,148 Q200,146 256,160 Q272,166 270,178 Q266,190 252,188 Q198,178 146,174 Q136,170 136,160 Q137,149 146,148 Z"/>
    <path class="lm" d="M262,152 Q278,146 286,152 L286,196 Q278,202 266,198 Q256,192 256,176 Q256,160 262,152 Z"/>
    <path class="lead" d="M232,226 L268,196"/>
    <path class="acc" d="M196,130 L244,140" marker-end="url(#ar)"><animate attributeName="opacity" values="1;.25;1" keyTimes="0;.5;1" dur="2s" repeatCount="indefinite"/></path>
    <text class="t lab" x="180" y="238">palm flat, wrist short</text>
    <text class="t lab" x="180" y="252">of full extension</text>
    <text class="t accT" x="166" y="104">3 × 30 seconds, phase 3</text>
    <text class="t cap" x="22" y="326">1. Lean gently into a palm on the</text>
    <text class="t cap" x="22" y="344">wall at chest height. Elbow soft.</text>
  </g>

  <!-- PANEL 2 -->
  <g>
    <rect class="wall" x="560" y="214" width="140" height="18" rx="4"/>
    <rect class="wall" x="572" y="232" width="10" height="70"/><rect class="wall" x="678" y="232" width="10" height="70"/>
    <text class="t lab" x="630" y="250" text-anchor="middle">bench</text>
    <g>
    <animateTransform attributeName="transform" type="rotate" values="0 390 276;0 390 276;5 390 276;5 390 276;0 390 276" keyTimes="0;.1;.55;.65;1" dur="3.4s" repeatCount="indefinite"/>
    <circle class="lm" cx="560" cy="150" r="20"/>
    <path class="torso" d="M392,262 Q470,214 540,170 Q552,164 560,174 Q566,186 556,194 Q486,240 404,286 Q392,292 386,282 Q382,270 392,262 Z"/>
    </g>
    <g>
    <animateTransform attributeName="transform" type="rotate" values="0 588 204;0 588 204;-17 588 204;-17 588 204;0 588 204" keyTimes="0;.1;.55;.65;1" dur="3.4s" repeatCount="indefinite"/>
    <path class="lm" d="M540,180 Q560,190 584,200 Q594,206 590,214 Q584,220 574,216 Q550,206 532,196 Z"/>
    </g>
    <path class="lm" d="M576,190 Q590,184 600,192 Q608,202 602,212 Q594,218 582,216 Q572,210 572,200 Q572,194 576,190 Z"/>
    <path class="ct" d="M584,194 Q590,200 588,210"/>
    <path class="lead" d="M630,164 L596,190"/>
    <text class="t lab" x="634" y="160">fists keep the</text>
    <text class="t lab" x="634" y="174">wrist straight</text>
    <text class="t accT" x="382" y="300">3 × 10, phase 4</text>
    <text class="t cap" x="382" y="326">2. Push-ups on fists against a bench</text>
    <text class="t cap" x="382" y="344">or counter, body in one line.</text>
  </g>

  <text class="t dose" x="22" y="382">Only once the wrist phase allows it. Step back one phase at any pain above 2 out of 10.</text>
</svg>
