<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="Finger extensor band, two steps">
  <style>
    .bg{fill:#FAF7F2}
    .lm{fill:#F2EDE4;stroke:#1F2421;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
    .im{fill:#DED3BF;stroke:#1F2421;stroke-width:2.2;stroke-linejoin:round}
    .hd{fill:#B9AE99;stroke:#1F2421;stroke-width:2.2;stroke-linejoin:round}
    .oth{fill:#E2E7E3;stroke:#1F2421;stroke-width:2.2;stroke-linejoin:round}
    .ct{fill:none;stroke:#1F2421;stroke-width:1.3;opacity:.42;stroke-linecap:round}
    .det{stroke:#1F2421;fill:none;stroke-width:1.8;stroke-linecap:round;opacity:.3}
    .acc{stroke:#C2543D;fill:none;stroke-width:3.2;stroke-linecap:round}
    .lead{stroke:#C2543D;fill:none;stroke-width:1.4;opacity:.72}
    .band{stroke:#5E7266;fill:none;stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round}
    .t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1F2421}
    .h{font-size:22px;font-weight:700}
    .sub{font-size:13.5px;fill:#6B6257}
    .cap{font-size:13.5px}
    .lab{font-size:11.5px;fill:#6B6257}
    .accT{font-size:12.5px;font-weight:700;fill:#C2543D}
    .dose{font-size:13px;fill:#4A443C}
    .div{stroke:#E2D9CB;stroke-width:1.5}
  </style>
  <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#C2543D"/>
  </marker>

  <rect class="bg" x="0" y="0" width="720" height="400"/>
  <text class="t h" x="22" y="32">Finger extensor band</text>
  <text class="t sub" x="22" y="54">Antagonist work. This is the balance for everything the gripping does.</text>
  <line class="div" x1="362" y1="72" x2="362" y2="356"/>

  <!-- PANEL 1 -->
  <g>
    <path class="lm" d="M156,236 Q136,228 122,234 Q110,242 115,254 Q122,265 138,263 Q152,260 160,250 Z"/>
    <path class="lm" d="M158,208 Q162,196 180,193 Q208,190 228,197 Q243,204 245,220 Q246,250 238,268 Q229,283 206,285 Q180,286 166,275 Q155,263 154,242 Q153,220 158,208 Z"/>
    <path class="ct" d="M162,244 Q158,228 166,214"/>
    <path class="lm" d="M164,204 L164,158 Q163,148 171,145 Q180,143 184,150 Q186,160 185,170 L185,204 Z"/>
    <path class="lm" d="M188,202 L188,150 Q187,139 196,136 Q205,134 209,141 Q211,152 210,162 L210,202 Z"/>
    <path class="lm" d="M213,203 L213,154 Q212,143 221,140 Q230,138 234,146 Q236,156 235,166 L235,203 Z"/>
    <path class="lm" d="M238,208 L238,166 Q237,156 245,153 Q253,151 257,159 Q259,168 258,177 L258,208 Z"/>
    <path class="ct" d="M166,176 Q175,173 185,176"/><path class="ct" d="M190,168 Q199,165 210,168"/>
    <path class="ct" d="M215,172 Q224,169 235,172"/><path class="ct" d="M240,184 Q248,181 258,184"/>
    <ellipse class="band" cx="211" cy="156" rx="52" ry="13" transform="rotate(-5 211 156)"/>
    <text class="t lab" x="211" y="120" text-anchor="middle">band around the fingertips</text>
    <text class="t lab" x="200" y="310" text-anchor="middle">start with the hand relaxed</text>
    <text class="t cap" x="22" y="326">1. Loop the band around all four</text>
    <text class="t cap" x="22" y="344">fingertips, hand relaxed.</text>
  </g>

  <!-- PANEL 2 -->
  <g transform="translate(351,0)">
    <path class="lm" d="M156,238 Q132,228 116,236 Q102,246 108,259 Q116,270 134,267 Q150,263 160,252 Z"/>
    <path class="lm" d="M158,208 Q162,196 180,193 Q208,190 228,197 Q243,204 245,220 Q246,250 238,268 Q229,283 206,285 Q180,286 166,275 Q155,263 154,242 Q153,220 158,208 Z"/>
    <path class="ct" d="M162,244 Q158,228 166,214"/>
    <g transform="rotate(-20 174 204)"><animateTransform attributeName="transform" type="rotate" values="0 174 204;0 174 204;-20 174 204;-20 174 204;0 174 204" keyTimes="0;.1;.5;.6;1" dur="5s" repeatCount="indefinite"/><path class="lm" d="M164,204 L164,158 Q163,148 171,145 Q180,143 184,150 Q186,160 185,170 L185,204 Z"/></g>
    <g transform="rotate(-7 199 202)"><animateTransform attributeName="transform" type="rotate" values="0 199 202;0 199 202;-7 199 202;-7 199 202;0 199 202" keyTimes="0;.1;.5;.6;1" dur="5s" repeatCount="indefinite"/><path class="lm" d="M188,202 L188,150 Q187,139 196,136 Q205,134 209,141 Q211,152 210,162 L210,202 Z"/></g>
    <g transform="rotate(7 224 203)"><animateTransform attributeName="transform" type="rotate" values="0 224 203;0 224 203;7 224 203;7 224 203;0 224 203" keyTimes="0;.1;.5;.6;1" dur="5s" repeatCount="indefinite"/><path class="lm" d="M213,203 L213,154 Q212,143 221,140 Q230,138 234,146 Q236,156 235,166 L235,203 Z"/></g>
    <g transform="rotate(20 248 208)"><animateTransform attributeName="transform" type="rotate" values="0 248 208;0 248 208;20 248 208;20 248 208;0 248 208" keyTimes="0;.1;.5;.6;1" dur="5s" repeatCount="indefinite"/><path class="lm" d="M238,208 L238,166 Q237,156 245,153 Q253,151 257,159 Q259,168 258,177 L258,208 Z"/></g>
    <ellipse class="band" cx="209" cy="150" rx="76" ry="11" style="stroke-width:3.4"><animate attributeName="rx" values="52;52;76;76;52" keyTimes="0;.1;.5;.6;1" dur="5s" repeatCount="indefinite"/><animate attributeName="ry" values="13;13;11;11;13" keyTimes="0;.1;.5;.6;1" dur="5s" repeatCount="indefinite"/><animate attributeName="cy" values="156;156;150;150;156" keyTimes="0;.1;.5;.6;1" dur="5s" repeatCount="indefinite"/></ellipse>
    <path class="acc" d="M124,140 L98,128" marker-end="url(#ar)"/>
    <path class="acc" d="M294,140 L320,128" marker-end="url(#ar)"/>
    <text class="t accT" x="209" y="114" text-anchor="middle">open slowly</text>
    <text class="t lab" x="200" y="310" text-anchor="middle">spread against the band</text>
    <text class="t cap" x="31" y="326">2. Open the hand slowly against</text>
    <text class="t cap" x="31" y="344">the band, then release.</text>
  </g>
  <text class="t dose" x="22" y="382">2 sets of 20, every day. Slow on the way open, slow on the way back.</text>
</svg>
