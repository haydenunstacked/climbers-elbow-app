<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="Shoulder band external rotation and horizontal row">
  <style>
    .bg{fill:#FAF7F2}
    .lm{fill:#F2EDE4;stroke:#1F2421;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
    .im{fill:#DED3BF;stroke:#1F2421;stroke-width:2.2;stroke-linejoin:round}
    .oth{fill:#E2E7E3;stroke:#1F2421;stroke-width:2.2;stroke-linejoin:round}
    .torso{fill:#D6CDBB;stroke:#1F2421;stroke-width:2.2;stroke-linejoin:round}
    .ct{fill:none;stroke:#1F2421;stroke-width:1.3;opacity:.4;stroke-linecap:round}
    .det{stroke:#1F2421;fill:none;stroke-width:1.8;stroke-linecap:round;opacity:.3}
    .acc{stroke:#C2543D;fill:none;stroke-width:3.2;stroke-linecap:round}
    .lead{stroke:#C2543D;fill:none;stroke-width:1.4;opacity:.72}
    .band{stroke:#5E7266;fill:none;stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round}
    .t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1F2421}
    .h{font-size:22px;font-weight:700}
    .sub{font-size:13.5px;fill:#6B6257}
    .cap{font-size:13.5px}
    .lab{font-size:11.5px;fill:#6B6257}
    .accT{font-size:12.5px;font-weight:700;fill:#C2543D}
    .dose{font-size:13px;fill:#4A443C}
    .div{stroke:#E2D9CB;stroke-width:1.5}
  </style>
  <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#C2543D"/>
  </marker>

  <rect class="bg" x="0" y="0" width="720" height="400"/>
  <text class="t h" x="22" y="32">Shoulder band work</text>
  <text class="t sub" x="22" y="54">Elbow load in climbers is often driven by what the shoulder is not doing.</text>
  <line class="div" x1="362" y1="72" x2="362" y2="356"/>

  <!-- PANEL 1 -->
  <g>
    <circle class="lm" cx="196" cy="114" r="27"/>
    <path class="torso" d="M152,152 Q196,142 240,152 Q256,158 258,178 Q262,220 256,252 Q250,270 228,274 Q196,280 164,274 Q142,270 137,252 Q131,220 135,178 Q137,158 152,152 Z"/>
    <path class="lm" d="M250,158 Q266,156 272,168 Q276,190 274,214 Q272,228 258,230 Q244,230 241,216 Q238,190 240,168 Q242,159 250,158 Z"/>
    <g transform="translate(240,0)"><g><animateTransform attributeName="transform" type="scale" values="1 1;1 1;-0.45 1;-0.45 1;1 1;1 1" keyTimes="0;.12;.47;.6;.95;1" dur="4s" repeatCount="indefinite"/><g transform="translate(-240,0)">
    <path class="lm" d="M244,214 Q246,230 232,236 Q206,242 178,238 Q166,234 166,222 Q166,210 178,207 Q206,202 232,206 Q242,206 244,214 Z"/>
    <path class="lm" d="M172,206 Q152,202 138,210 Q126,220 132,232 Q140,242 158,240 Q172,236 178,226 Z"/>
    </g></g></g>
    <path class="band" d="M132,224 L118,212 L104,236 L90,212 L76,236 L62,224"><animate attributeName="d" values="M132,224 L118,212 L104,236 L90,212 L76,236 L62,224;M132,224 L118,212 L104,236 L90,212 L76,236 L62,224;M289,224 L244,228 L198,220 L153,228 L107,220 L62,224;M289,224 L244,228 L198,220 L153,228 L107,220 L62,224;M132,224 L118,212 L104,236 L90,212 L76,236 L62,224;M132,224 L118,212 L104,236 L90,212 L76,236 L62,224" keyTimes="0;.12;.47;.6;.95;1" dur="4s" repeatCount="indefinite"/></path>
    <rect class="im" x="44" y="204" width="15" height="42" rx="5"/>
    <text class="t lab" x="51" y="262" text-anchor="middle">anchor</text>
    <path class="acc" d="M158,288 A82,82 0 0 0 264,266" marker-end="url(#ar)"/>
    <text class="t accT" x="272" y="288">rotate outward</text>
    <path class="lead" d="M304,192 L278,190"/>
    <text class="t lab" x="308" y="196">elbow pinned</text>
    <text class="t lab" x="308" y="212">to the ribs</text>
    <text class="t cap" x="22" y="326">1. Band external rotation. The elbow</text>
    <text class="t cap" x="22" y="344">never leaves your side.</text>
  </g>

  <!-- PANEL 2 -->
  <g>
    <circle class="lm" cx="452" cy="114" r="25"/>
    <path class="torso" d="M424,148 Q452,140 476,148 Q488,154 490,174 Q494,216 488,250 Q482,268 462,272 Q440,276 426,270 Q414,264 412,246 Q408,214 412,174 Q414,154 424,148 Z"/>
    <path class="lm" d="M484,158 Q516,151 546,158 Q560,163 560,176 Q560,189 546,193 Q516,199 484,192 Q472,187 472,175 Q472,163 484,158 Z"><animate attributeName="d" values="M484,158 Q516,151 546,158 Q560,163 560,176 Q560,189 546,193 Q516,199 484,192 Q472,187 472,175 Q472,163 484,158 Z;M484,158 Q516,151 546,158 Q560,163 560,176 Q560,189 546,193 Q516,199 484,192 Q472,187 472,175 Q472,163 484,158 Z;M480,158 Q491,151 502,158 Q507,163 507,176 Q507,189 502,193 Q491,199 480,192 Q476,187 476,175 Q476,163 480,158 Z;M480,158 Q491,151 502,158 Q507,163 507,176 Q507,189 502,193 Q491,199 480,192 Q476,187 476,175 Q476,163 480,158 Z;M484,158 Q516,151 546,158 Q560,163 560,176 Q560,189 546,193 Q516,199 484,192 Q472,187 472,175 Q472,163 484,158 Z;M484,158 Q516,151 546,158 Q560,163 560,176 Q560,189 546,193 Q516,199 484,192 Q472,187 472,175 Q472,163 484,158 Z" keyTimes="0;.12;.45;.6;.95;1" dur="4s" repeatCount="indefinite"/></path>
    <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0;-53 0;-53 0;0 0;0 0" keyTimes="0;.12;.45;.6;.95;1" dur="4s" repeatCount="indefinite"/>
    <path class="lm" d="M550,161 Q578,155 602,161 Q614,166 614,177 Q614,189 602,194 Q578,199 550,193 Q540,188 540,177 Q540,166 550,161 Z"/>
    <path class="lm" d="M598,170 Q594,158 604,152 Q614,146 621,154 Q629,147 635,156 Q642,151 646,161 Q649,172 644,182 Q635,195 618,196 Q602,195 597,184 Q593,176 598,170 Z"/>
    <path class="ct" d="M613,157 Q615,166 612,175"/><path class="ct" d="M628,158 Q630,167 627,176"/>
    </g>
    <path class="band" d="M628,177 L637,167 L646,187 L655,167 L664,187 L672,177"><animate attributeName="d" values="M628,177 L637,167 L646,187 L655,167 L664,187 L672,177;M628,177 L637,167 L646,187 L655,167 L664,187 L672,177;M575,177 L594,184 L614,170 L633,184 L653,170 L672,177;M575,177 L594,184 L614,170 L633,184 L653,170 L672,177;M628,177 L637,167 L646,187 L655,167 L664,187 L672,177;M628,177 L637,167 L646,187 L655,167 L664,187 L672,177" keyTimes="0;.12;.45;.6;.95;1" dur="4s" repeatCount="indefinite"/></path>
    <rect class="im" x="674" y="157" width="14" height="40" rx="5"/>
    <text class="t lab" x="681" y="212" text-anchor="middle">anchor</text>
    <path class="acc" d="M578,122 L500,122" marker-end="url(#ar)"/>
    <text class="t accT" x="586" y="126">pull back</text>
    <path class="lead" d="M452,284 L458,272"/>
    <text class="t lab" x="452" y="298" text-anchor="middle">squeeze the shoulder blades</text>
    <text class="t cap" x="382" y="326">2. Horizontal row. Drive the elbow</text>
    <text class="t cap" x="382" y="344">back, do not shrug.</text>
  </g>

  <text class="t dose" x="22" y="382">2 sets of 15 each, three days a week.</text>
</svg>
