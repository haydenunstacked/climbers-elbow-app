<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="Eccentric wrist flexion with a dumbbell, two steps">
  <style>
    .bg{fill:#FAF7F2}
    .limb{fill:#EFE9DF;stroke:#1F2421;stroke-width:2.5;stroke-linejoin:round}
    .imp{fill:#DED3BF;stroke:#1F2421;stroke-width:2.5;stroke-linejoin:round}
    .det{stroke:#1F2421;fill:none;stroke-width:2;stroke-linecap:round;opacity:.35}
    .acc{stroke:#C2543D;fill:none;stroke-width:3.2;stroke-linecap:round}
    .t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1F2421}
    .h{font-size:22px;font-weight:700}
    .sub{font-size:13.5px;fill:#6B6257}
    .cap{font-size:13.5px}
    .lab{font-size:11.5px;fill:#6B6257}
    .accT{font-size:12.5px;font-weight:700;fill:#C2543D}
    .dose{font-size:13px;fill:#4A443C}
    .div{stroke:#E2D9CB;stroke-width:1.5}
  </style>
  <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#C2543D"/>
  </marker>

  <rect class="bg" x="0" y="0" width="720" height="400"/>
  <text class="t h" x="22" y="32">Eccentric wrist flexion, dumbbell version</text>
  <text class="t sub" x="22" y="54">Substitute for the FlexBar. Seated, right forearm resting on the thigh, palm up.</text>
  <line class="div" x1="362" y1="72" x2="362" y2="356"/>

  <!-- PANEL 1 -->
  <g>
    <rect class="imp" x="30" y="214" width="164" height="46" rx="22"/>
    <text class="t lab" x="110" y="243" text-anchor="middle">thigh</text>
    <rect class="limb" x="50" y="180" width="142" height="30" rx="15"/>
    <rect class="limb" x="190" y="176" width="44" height="36" rx="13" transform="rotate(-50 192 194)"/>
    <circle class="imp" cx="234" cy="148" r="21"/>
    <circle class="det" cx="234" cy="148" r="8"/>
    <rect class="limb" x="248" y="160" width="46" height="26" rx="13" transform="rotate(28 248 173)"/>
    <path class="acc" d="M310,212 L310,156" marker-end="url(#ar)"/>
    <text class="t accT" x="310" y="144" text-anchor="middle">assist up</text>
    <text class="t lab" x="56" y="172">palm up</text>
    <text class="t lab" x="268" y="222">left hand</text>
    <text class="t cap" x="22" y="326">1. Palm up on the thigh. Left hand</text>
    <text class="t cap" x="22" y="344">helps the weight up into flexion.</text>
  </g>

  <!-- PANEL 2 -->
  <g>
    <rect class="imp" x="390" y="214" width="164" height="46" rx="22"/>
    <text class="t lab" x="470" y="243" text-anchor="middle">thigh</text>
    <rect class="limb" x="410" y="180" width="142" height="30" rx="15"/>
    <rect class="limb" x="550" y="176" width="44" height="36" rx="13" transform="rotate(35 552 194)"/>
    <circle class="imp" cx="602" cy="232" r="21"/>
    <circle class="det" cx="602" cy="232" r="8"/>
    <path class="acc" d="M650,166 L650,238" marker-end="url(#ar)"/>
    <text class="t accT" x="650" y="156" text-anchor="middle">4 seconds</text>
    <text class="t lab" x="500" y="290" text-anchor="middle">wrist lowers into extension</text>
    <text class="t cap" x="382" y="326">2. Lower over 4 seconds with the</text>
    <text class="t cap" x="382" y="344">right hand only. That is the rep.</text>
  </g>

  <text class="t dose" x="22" y="382">3 sets of 15, 4 second lowering, every day. Only use this if you do not have a FlexBar.</text>
</svg>
