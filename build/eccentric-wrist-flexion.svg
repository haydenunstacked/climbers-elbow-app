<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="Eccentric wrist flexion with a dumbbell, two steps">
  <style>
    .bg{fill:#FAF7F2}
    .lm{fill:#F2EDE4;stroke:#1F2421;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
    .im{fill:#DED3BF;stroke:#1F2421;stroke-width:2.2;stroke-linejoin:round}
    .hd{fill:#B9AE99;stroke:#1F2421;stroke-width:2.2;stroke-linejoin:round}
    .oth{fill:#E2E7E3;stroke:#1F2421;stroke-width:2.2;stroke-linejoin:round}
    .torso{fill:#D6CDBB;stroke:#1F2421;stroke-width:2.2;stroke-linejoin:round}
    .ct{fill:none;stroke:#1F2421;stroke-width:1.3;opacity:.4;stroke-linecap:round}
    .det{stroke:#1F2421;fill:none;stroke-width:1.8;stroke-linecap:round;opacity:.3}
    .acc{stroke:#C2543D;fill:none;stroke-width:3.2;stroke-linecap:round}
    .lead{stroke:#C2543D;fill:none;stroke-width:1.4;opacity:.72}
    .band{stroke:#5E7266;fill:none;stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round}
    .t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1F2421}
    .h{font-size:22px;font-weight:700}
    .sub{font-size:13.5px;fill:#6B6257}
    .cap{font-size:13.5px}
    .lab{font-size:11.5px;fill:#6B6257}
    .accT{font-size:12.5px;font-weight:700;fill:#C2543D}
    .dose{font-size:13px;fill:#4A443C}
    .div{stroke:#E2D9CB;stroke-width:1.5}
  </style>
  <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#C2543D"/>
  </marker>

  <rect class="bg" x="0" y="0" width="720" height="400"/>
  <text class="t h" x="22" y="32">Eccentric wrist flexion, dumbbell version</text>
  <text class="t sub" x="22" y="54">Substitute for the FlexBar. Seated, right forearm resting on the thigh, palm up.</text>
  <line class="div" x1="362" y1="72" x2="362" y2="356"/>

  <!-- PANEL 1 -->
  <g>
    <path class="im" d="M26,226 Q94,217 148,223 Q172,226 180,242 Q182,258 166,266 Q98,274 32,269 Q17,264 16,248 Q16,232 26,226 Z"/>
    <text class="t lab" x="98" y="252" text-anchor="middle">thigh</text>
    <path class="lm" d="M48,180 Q100,173 142,181 Q162,185 172,193 L172,211 Q157,217 138,216 Q96,218 50,211 Q37,206 36,196 Q36,185 48,180 Z"/>
    <text class="t lab" x="52" y="172">palm up</text>
    <path class="lm" d="M168,190 Q164,174 176,166 Q188,158 197,168 Q207,158 215,169 Q224,162 229,175 Q233,189 227,202 Q217,219 196,221 Q176,220 169,206 Q164,197 168,190 Z"/>
    <path class="ct" d="M186,172 Q188,182 185,192"/><path class="ct" d="M204,172 Q206,182 203,192"/>
    <path class="im" d="M206,152 L222,142 L229,154 L213,164 Z"/>
    <circle class="im" cx="248" cy="132" r="21"/>
    <circle class="det" cx="248" cy="132" r="8"/>
    <path class="oth" d="M238,208 Q232,194 244,186 Q256,178 265,188 Q275,178 283,189 Q292,183 296,196 Q299,210 292,220 Q281,232 262,232 Q244,230 239,218 Q235,212 238,208 Z"/>
    <path class="ct" d="M256,192 Q258,202 255,211"/><path class="ct" d="M274,192 Q276,202 273,211"/>
    <text class="t lab" x="268" y="250" text-anchor="middle">left hand</text>
    <path class="acc" d="M320,206 L320,146" marker-end="url(#ar)"/>
    <text class="t accT" x="320" y="134" text-anchor="middle">assist up</text>
    <text class="t cap" x="22" y="326">1. Palm up on the thigh. Left hand</text>
    <text class="t cap" x="22" y="344">helps the weight up into flexion.</text>
  </g>

  <!-- PANEL 2 -->
  <g transform="translate(351,0)">
    <path class="im" d="M26,226 Q94,217 148,223 Q172,226 180,242 Q182,258 166,266 Q98,274 32,269 Q17,264 16,248 Q16,232 26,226 Z"/>
    <text class="t lab" x="98" y="252" text-anchor="middle">thigh</text>
    <path class="lm" d="M48,180 Q100,173 142,181 Q162,185 172,193 L172,211 Q157,217 138,216 Q96,218 50,211 Q37,206 36,196 Q36,185 48,180 Z"/>
    <path class="lm" d="M168,204 Q164,220 176,228 Q188,236 197,226 Q207,236 215,225 Q224,232 229,219 Q233,205 227,192 Q217,175 196,173 Q176,174 169,188 Q164,197 168,204 Z"/>
    <path class="ct" d="M186,222 Q188,212 185,202"/><path class="ct" d="M204,222 Q206,212 203,202"/>
    <circle class="im" cx="238" cy="264" r="21"/>
    <circle class="det" cx="238" cy="264" r="8"/>
    <path class="im" d="M210,232 L226,242 L219,254 L203,244 Z"/>
    <text class="t lab" x="150" y="304" text-anchor="middle">wrist lowers into extension</text>
    <path class="acc" d="M300,158 L300,232" marker-end="url(#ar)"/>
    <text class="t accT" x="300" y="146" text-anchor="middle">4 seconds</text>
    <text class="t cap" x="31" y="326">2. Lower over 4 seconds with the</text>
    <text class="t cap" x="31" y="344">right hand only. That is the rep.</text>
  </g>
  <text class="t dose" x="22" y="382">3 sets of 15, 4 second lowering, every day. Only use this if you do not have a FlexBar.</text>
</svg>
