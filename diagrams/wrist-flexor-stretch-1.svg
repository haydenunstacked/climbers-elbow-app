<svg xmlns="http://www.w3.org/2000/svg" viewBox="15 74 351 286" role="img" aria-label="wrist-flexor-stretch step 1">
  <style>
    .bg{fill:#FAF7F2}
    .limb{fill:#EFE9DF;stroke:#1F2421;stroke-width:2.5;stroke-linejoin:round}
    .other{fill:#E2E6E2;stroke:#1F2421;stroke-width:2.5;stroke-linejoin:round}
    .det{stroke:#1F2421;fill:none;stroke-width:2;stroke-linecap:round;opacity:.35}
    .acc{stroke:#C2543D;fill:none;stroke-width:3.2;stroke-linecap:round}
    .lead{stroke:#C2543D;fill:none;stroke-width:1.4;opacity:.7}
    .t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1F2421}
    .h{font-size:22px;font-weight:700}
    .sub{font-size:13.5px;fill:#6B6257}
    .cap{font-size:13.5px}
    .lab{font-size:11.5px;fill:#6B6257}
    .accT{font-size:12.5px;font-weight:700;fill:#C2543D}
    .dose{font-size:13px;fill:#4A443C}
    .div{stroke:#E2D9CB;stroke-width:1.5}
  </style>
  <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#C2543D"/>
  </marker>
  <rect x="15" y="74" width="351" height="286" fill="#FAF7F2"/>
  <g>
    <rect class="limb" x="34" y="204" width="152" height="30" rx="15"/>
    <text class="t lab" x="66" y="252">elbow straight</text>
    <rect class="limb" x="176" y="140" width="42" height="82" rx="15" transform="rotate(-16 197 220)"/>
    <circle class="limb" cx="216" cy="204" r="9"/>
    <rect class="other" x="150" y="126" width="66" height="26" rx="13" transform="rotate(-16 197 140)"/>
    <path class="acc" d="M236,126 L196,110" marker-end="url(#ar)"/>
    <text class="t accT" x="242" y="124">pull gently</text>
    <path class="lead" d="M244,206 L224,204"/>
    <text class="t lab" x="250" y="210">thumb</text>
    <text class="t accT" x="104" y="300" text-anchor="middle">palm down, thumb turned in</text>
    <text class="t cap" x="22" y="326">1. Palm facing down, thumb rolled</text>
    <text class="t cap" x="22" y="344">inward toward your body.</text>
  </g>
