<svg xmlns="http://www.w3.org/2000/svg" viewBox="15 74 377 286" role="img" aria-label="shoulder-band-work step 1">
  <style>
    .bg{fill:#FAF7F2}
    .limb{fill:#EFE9DF;stroke:#1F2421;stroke-width:2.5;stroke-linejoin:round}
    .torso{fill:#D6CDBB;stroke:#1F2421;stroke-width:2.5;stroke-linejoin:round}
    .imp{fill:#DED3BF;stroke:#1F2421;stroke-width:2.5;stroke-linejoin:round}
    .band{stroke:#5E7266;fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
    .det{stroke:#1F2421;fill:none;stroke-width:2;stroke-linecap:round;opacity:.35}
    .acc{stroke:#C2543D;fill:none;stroke-width:3.2;stroke-linecap:round}
    .lead{stroke:#C2543D;fill:none;stroke-width:1.4;opacity:.7}
    .t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1F2421}
    .h{font-size:22px;font-weight:700}
    .sub{font-size:13.5px;fill:#6B6257}
    .cap{font-size:13.5px}
    .lab{font-size:11.5px;fill:#6B6257}
    .accT{font-size:12.5px;font-weight:700;fill:#C2543D}
    .dose{font-size:13px;fill:#4A443C}
    .div{stroke:#E2D9CB;stroke-width:1.5}
  </style>
  <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#C2543D"/>
  </marker>
  <rect x="15" y="74" width="377" height="286" fill="#FAF7F2"/>
  <g>
    <circle class="limb" cx="196" cy="112" r="26"/>
    <rect class="torso" x="140" y="136" width="112" height="130" rx="26"/>
    <rect class="limb" x="248" y="152" width="26" height="76" rx="13"/>
    <rect class="limb" x="186" y="216" width="80" height="26" rx="13"/>
    <rect class="limb" x="160" y="212" width="30" height="34" rx="12"/>
    <path class="band" d="M158,229 L146,219 L134,239 L122,219 L110,239 L98,229"/>
    <rect class="imp" x="80" y="210" width="14" height="40" rx="4"/>
    <text class="t lab" x="87" y="266" text-anchor="middle">anchor</text>
    <path class="acc" d="M172,272 A76,76 0 0 0 268,258" marker-end="url(#ar)"/>
    <text class="t accT" x="276" y="292" text-anchor="end">rotate outward</text>
    <path class="lead" d="M298,196 L272,190"/>
    <text class="t lab" x="302" y="200">elbow pinned</text>
    <text class="t lab" x="302" y="216">to the ribs</text>
    <text class="t cap" x="22" y="326">1. Band external rotation. The elbow</text>
