<svg xmlns="http://www.w3.org/2000/svg" viewBox="366 74 346 286" role="img" aria-label="pronator-lever step 2">
  <style>
    .bg{fill:#FAF7F2}
    .limb{fill:#EFE9DF;stroke:#1F2421;stroke-width:2.5;stroke-linejoin:round}
    .imp{fill:#DED3BF;stroke:#1F2421;stroke-width:2.5;stroke-linejoin:round}
    .head{fill:#B9AE99;stroke:#1F2421;stroke-width:2.5;stroke-linejoin:round}
    .det{stroke:#1F2421;fill:none;stroke-width:2;stroke-linecap:round;opacity:.35}
    .acc{stroke:#C2543D;fill:none;stroke-width:3.2;stroke-linecap:round}
    .t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1F2421}
    .h{font-size:22px;font-weight:700}
    .sub{font-size:13.5px;fill:#6B6257}
    .cap{font-size:13.5px}
    .lab{font-size:11.5px;fill:#6B6257}
    .accT{font-size:12.5px;font-weight:700;fill:#C2543D}
    .dose{font-size:13px;fill:#4A443C}
    .div{stroke:#E2D9CB;stroke-width:1.5}
  </style>
  <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#C2543D"/>
  </marker>
  <rect x="366" y="74" width="346" height="286" fill="#FAF7F2"/>
  <g>
    <rect class="imp" x="390" y="228" width="160" height="46" rx="22"/>
    <text class="t lab" x="468" y="257" text-anchor="middle">thigh</text>
    <rect class="limb" x="406" y="194" width="142" height="30" rx="15"/>
    <rect class="limb" x="546" y="192" width="44" height="34" rx="14"/>
    <rect class="imp" x="562" y="122" width="13" height="80" rx="6"/>
    <rect class="head" x="550" y="96" width="38" height="26" rx="5"/>
    <path class="acc" d="M614,132 A72,72 0 0 1 634,224" marker-end="url(#ar)"/>
    <text class="t accT" x="704" y="180" text-anchor="end">5 second</text>
    <text class="t accT" x="704" y="196" text-anchor="end">lower</text>
    <text class="t lab" x="468" y="300" text-anchor="middle">vertical at the top</text>
    <text class="t cap" x="382" y="326">2. Rotate to vertical through</text>
    <text class="t cap" x="382" y="344">pronation, then lower slowly.</text>
