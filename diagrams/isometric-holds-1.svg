<svg xmlns="http://www.w3.org/2000/svg" viewBox="15 74 351 286" role="img" aria-label="isometric-holds step 1">
  <style>
    .bg{fill:#FAF7F2}
    .limb{fill:#EFE9DF;stroke:#1F2421;stroke-width:2.5;stroke-linejoin:round}
    .other{fill:#E2E6E2;stroke:#1F2421;stroke-width:2.5;stroke-linejoin:round}
    .imp{fill:#DED3BF;stroke:#1F2421;stroke-width:2.5;stroke-linejoin:round}
    .det{stroke:#1F2421;fill:none;stroke-width:2;stroke-linecap:round;opacity:.35}
    .acc{stroke:#C2543D;fill:none;stroke-width:3.2;stroke-linecap:round}
    .lead{stroke:#C2543D;fill:none;stroke-width:1.4;opacity:.7}
    .t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1F2421}
    .h{font-size:22px;font-weight:700}
    .sub{font-size:13.5px;fill:#6B6257}
    .cap{font-size:13.5px}
    .lab{font-size:11.5px;fill:#6B6257}
    .accT{font-size:12.5px;font-weight:700;fill:#C2543D}
    .dose{font-size:13px;fill:#4A443C}
    .div{stroke:#E2D9CB;stroke-width:1.5}
  </style>
  <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#C2543D"/>
  </marker>
  <rect x="15" y="74" width="351" height="286" fill="#FAF7F2"/>
  <g>
    <rect class="imp" x="70" y="96" width="176" height="20" rx="9"/>
    <text class="t lab" x="158" y="88" text-anchor="middle">jug or rail, neutral grip</text>
    <rect class="limb" x="140" y="92" width="40" height="34" rx="13"/>
    <rect class="limb" x="147" y="120" width="26" height="72" rx="13"/>
    <rect class="limb" x="147" y="184" width="26" height="76" rx="13" transform="rotate(28 160 190)"/>
    <circle class="limb" cx="160" cy="190" r="15"/>
    <path class="acc" d="M214,182 A44,44 0 0 0 214,238"/>
    <text class="t accT" x="224" y="216">hold, do not move</text>
    <path class="lead" d="M104,206 L142,194"/>
    <text class="t lab" x="100" y="210" text-anchor="end">elbow bent</text>
    <text class="t lab" x="100" y="226" text-anchor="end">to mid range</text>
    <text class="t cap" x="22" y="326">1. Neutral grip lock off hold. Hang</text>
    <text class="t cap" x="22" y="344">still at a mid range elbow bend.</text>
    <text class="t accT" x="22" y="300">15 to 20 seconds, 2 to 3 sets</text>
  </g>
</svg>
