<svg xmlns="http://www.w3.org/2000/svg" viewBox="366 74 346 286" role="img" aria-label="shoulder-band-work step 2">
  <style>
    .bg{fill:#FAF7F2}
    .limb{fill:#EFE9DF;stroke:#1F2421;stroke-width:2.5;stroke-linejoin:round}
    .torso{fill:#D6CDBB;stroke:#1F2421;stroke-width:2.5;stroke-linejoin:round}
    .imp{fill:#DED3BF;stroke:#1F2421;stroke-width:2.5;stroke-linejoin:round}
    .band{stroke:#5E7266;fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
    .det{stroke:#1F2421;fill:none;stroke-width:2;stroke-linecap:round;opacity:.35}
    .acc{stroke:#C2543D;fill:none;stroke-width:3.2;stroke-linecap:round}
    .lead{stroke:#C2543D;fill:none;stroke-width:1.4;opacity:.7}
    .t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1F2421}
    .h{font-size:22px;font-weight:700}
    .sub{font-size:13.5px;fill:#6B6257}
    .cap{font-size:13.5px}
    .lab{font-size:11.5px;fill:#6B6257}
    .accT{font-size:12.5px;font-weight:700;fill:#C2543D}
    .dose{font-size:13px;fill:#4A443C}
    .div{stroke:#E2D9CB;stroke-width:1.5}
  </style>
  <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#C2543D"/>
  </marker>
  <rect x="366" y="74" width="346" height="286" fill="#FAF7F2"/>
  <g>
    <circle class="limb" cx="446" cy="112" r="24"/>
    <rect class="torso" x="420" y="134" width="56" height="134" rx="22"/>
    <rect class="limb" x="472" y="158" width="62" height="26" rx="13"/>
    <rect class="limb" x="530" y="158" width="58" height="26" rx="13"/>
    <rect class="limb" x="584" y="156" width="30" height="30" rx="12"/>
    <path class="band" d="M612,171 L622,161 L632,181 L642,161 L652,181 L662,171"/>
    <rect class="imp" x="664" y="152" width="14" height="40" rx="4"/>
    <text class="t lab" x="671" y="208" text-anchor="middle">anchor</text>
    <path class="acc" d="M576,124 L506,124" marker-end="url(#ar)"/>
    <text class="t accT" x="584" y="128">pull back</text>
    <path class="lead" d="M452,286 L458,270"/>
    <text class="t lab" x="452" y="300" text-anchor="middle">squeeze the shoulder blades</text>
    <text class="t cap" x="382" y="326">2. Horizontal row. Drive the elbow</text>
    <text class="t cap" x="382" y="344">back, do not shrug.</text>
  </g>
