<svg xmlns="http://www.w3.org/2000/svg" viewBox="366 74 346 286" role="img" aria-label="reverse-wrist-curl step 2">
  <style>
    .bg{fill:#FAF7F2}
    .limb{fill:#EFE9DF;stroke:#1F2421;stroke-width:2.5;stroke-linejoin:round}
    .imp{fill:#DED3BF;stroke:#1F2421;stroke-width:2.5;stroke-linejoin:round}
    .det{stroke:#1F2421;fill:none;stroke-width:2;stroke-linecap:round;opacity:.35}
    .acc{stroke:#C2543D;fill:none;stroke-width:3.2;stroke-linecap:round}
    .t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1F2421}
    .h{font-size:22px;font-weight:700}
    .sub{font-size:13.5px;fill:#6B6257}
    .cap{font-size:13.5px}
    .lab{font-size:11.5px;fill:#6B6257}
    .accT{font-size:12.5px;font-weight:700;fill:#C2543D}
    .dose{font-size:13px;fill:#4A443C}
    .div{stroke:#E2D9CB;stroke-width:1.5}
  </style>
  <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#C2543D"/>
  </marker>
  <rect x="366" y="74" width="346" height="286" fill="#FAF7F2"/>
  <g>
    <rect class="imp" x="390" y="214" width="164" height="46" rx="22"/>
    <text class="t lab" x="470" y="243" text-anchor="middle">thigh</text>
    <rect class="limb" x="410" y="180" width="142" height="30" rx="15"/>
    <rect class="limb" x="550" y="178" width="44" height="34" rx="13" transform="rotate(-42 552 194)"/>
    <circle class="imp" cx="598" cy="152" r="21"/>
    <circle class="det" cx="598" cy="152" r="8"/>
    <path class="acc" d="M666,166 L666,238" marker-end="url(#ar)"/>
    <text class="t accT" x="666" y="262" text-anchor="middle">lower slowly</text>
    <text class="t lab" x="470" y="300" text-anchor="middle">top, knuckles lifted</text>
    <text class="t cap" x="382" y="326">2. Curl the knuckles up, then lower</text>
    <text class="t cap" x="382" y="344">back down under control.</text>
  </g>
</svg>
