    <text class="t lab" x="180" y="238">palm flat, wrist short</text>
    <text class="t lab" x="180" y="252">of full extension</text>
    <text class="t accT" x="166" y="104">3 × 30 seconds, phase 3</text>
    <text class="t cap" x="22" y="326">1. Lean gently into a palm on the</text>
    <text class="t cap" x="22" y="344">wall at chest height. Elbow soft.</text>
