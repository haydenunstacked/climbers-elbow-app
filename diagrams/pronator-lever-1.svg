<svg xmlns="http://www.w3.org/2000/svg" viewBox="15 74 351 286" role="img" aria-label="pronator-lever step 1">
  <style>
    .bg{fill:#FAF7F2}
    .limb{fill:#EFE9DF;stroke:#1F2421;stroke-width:2.5;stroke-linejoin:round}
    .imp{fill:#DED3BF;stroke:#1F2421;stroke-width:2.5;stroke-linejoin:round}
    .head{fill:#B9AE99;stroke:#1F2421;stroke-width:2.5;stroke-linejoin:round}
    .det{stroke:#1F2421;fill:none;stroke-width:2;stroke-linecap:round;opacity:.35}
    .acc{stroke:#C2543D;fill:none;stroke-width:3.2;stroke-linecap:round}
    .t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#1F2421}
    .h{font-size:22px;font-weight:700}
    .sub{font-size:13.5px;fill:#6B6257}
    .cap{font-size:13.5px}
    .lab{font-size:11.5px;fill:#6B6257}
    .accT{font-size:12.5px;font-weight:700;fill:#C2543D}
    .dose{font-size:13px;fill:#4A443C}
    .div{stroke:#E2D9CB;stroke-width:1.5}
  </style>
  <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#C2543D"/>
  </marker>
  <rect x="15" y="74" width="351" height="286" fill="#FAF7F2"/>
  <g>
    <rect class="imp" x="30" y="228" width="160" height="46" rx="22"/>
    <text class="t lab" x="108" y="257" text-anchor="middle">thigh</text>
    <rect class="limb" x="46" y="194" width="142" height="30" rx="15"/>
    <text class="t lab" x="52" y="186">palm up</text>
    <rect class="limb" x="186" y="192" width="44" height="34" rx="14"/>
    <g transform="rotate(38 226 209)">
      <rect class="imp" x="226" y="203" width="82" height="13" rx="6"/>
      <rect class="head" x="300" y="190" width="26" height="38" rx="5"/>
    </g>
    <path class="acc" d="M296,258 A76,76 0 0 0 262,158" marker-end="url(#ar)"/>
    <text class="t accT" x="300" y="150" text-anchor="middle">rotate up</text>
    <text class="t lab" x="196" y="300">head hangs to the thumb side</text>
    <text class="t cap" x="22" y="326">1. Start palm up with the hammer</text>
    <text class="t cap" x="22" y="344">head hanging out to the side.</text>
  </g>
</svg>
